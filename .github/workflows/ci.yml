name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # issue #72: `ruby/lib/note2web_export_core.rb` is pure note2web logic with no
  # dependency on an `apple_cloud_notes_parser` clone (see ruby/test/ correction C).
  # Deliberately NOT cloning/bundle-installing the upstream parser here — the
  # correctness-critical, testable-in-CI logic lives entirely in that core file, and
  # `ruby/note2web_export.rb` (the thin entry point that requires the upstream lib/)
  # is covered by `ruby -c` syntax checks only, keeping this job hermetic (no external
  # clone, no network access, no Bundler/Gemfile from a third-party repo in CI).
  ruby-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - run: ruby -c ruby/note2web_export.rb
      - run: ruby -c ruby/lib/note2web_export_core.rb
      - run: ruby -c ruby/test/note2web_export_core_test.rb
      # `npm run test:ruby`(package.json)runs the exact same file(s) via a Node.js
      # discovery script; invoked directly here so this job doesn't need a Node.js
      # setup step of its own.
      - run: ruby -Iruby/lib ruby/test/note2web_export_core_test.rb
